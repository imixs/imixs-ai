<ui:composition template="/WEB-INF/templates/layout.xhtml" xmlns:faces="jakarta.faces" xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:a="http://xmlns.jcp.org/jsf/passthrough">

	<ui:define name="content">
		<f:view>

			<div class="header">
				<h2>
					<span class="typcn typcn-download-outline"></span> Imixs AI RAG Retrieval
				</h2>
			</div>
			<h:form id="connect_form_id">

				<div class="card">

					<p class="help">
						<span class="typcn typcn-lightbulb"></span> Prompt:
					</p>

					<div class="imixs-form-section" style="grid-column-start: span 12;">

						<h:inputTextarea required="false" style="height: 8em;width: 100%;" styleClass="imixs-properties"
							a:spellCheck="false" a:autoComplete="off" a:autoCorrect="off" a:autoCapitalize="off"
							a:data-gramm="false" value="#{dashboardController.prompt}">
						</h:inputTextarea>

					</div>

					<div class="imixs-form-section">

						<span style="grid-column-start: span 8;">

							<h:commandButton value="Start" style="background:#4dc24f;"
								actionListener="#{dashboardController.prompt()}"
								rendered="#{dashboardController.connected}" />

						</span>
					</div>
				</div>

				<!-- Message Log -->
				<div class="card">
					<h3>
						<span class="typcn typcn-input-checked"></span> Log
					</h3>
					<pre>
						<ui:repeat var="log" value="#{logController.getLogEntries('RESTORE')}">
							<h:outputText value="#{log}" /><br />
						</ui:repeat>
					</pre>
				</div>
			</h:form>
		</f:view>
	</ui:define>
</ui:composition>
